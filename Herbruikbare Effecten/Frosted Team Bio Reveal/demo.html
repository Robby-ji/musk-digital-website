<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../../styles.css" />
    <link rel="stylesheet" href="frosted-team-bio-reveal.css" />
    <title>Frosted Team Bio Reveal — Demo</title>
    <style>
      body { min-height: 100vh; display: grid; place-items: center; padding: 48px 20px; background: #faf9f7; }
      .frosted-team-card { width: min(416px, 92vw); }
    </style>
  </head>
  <body>
    <a class="frosted-team-card" href="#profile" aria-label="Bekijk het profiel van Mark Otto">
      <div class="frosted-team-card__media">
        <div class="frosted-team-card__clip">
          <img class="frosted-team-card__image" src="../../assets/idea-reality/idea-reality-poster.jpg" alt="Abstract demonstratiebeeld" />
          <div class="frosted-team-card__shade" aria-hidden="true"></div>
          <p class="frosted-team-card__bio">A designer who blends creativity and strategy to turn bold ideas into meaningful experiences.</p>
        </div>
      </div>
      <div class="frosted-team-card__identity">
        <h3 class="frosted-team-card__name">Mark Otto</h3>
        <p class="frosted-team-card__role">Co-founder and CEO</p>
      </div>
    </a>
  </body>
</html>
