<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="gravity-stars-cursor-field.css" />
    <title>Gravity Stars Cursor Field</title>
  </head>
  <body>
    <section class="gravity-stars-field" data-gravity-stars data-count="240" data-connect-distance="120" data-tint="0.65" data-gravity-radius="340" data-gravity-strength="0.2" data-pointer-response="0.32" data-max-offset="130" style="min-height:100vh">
      <canvas class="gravity-stars-field__canvas" data-gravity-stars-canvas aria-hidden="true"></canvas>
      <div class="gravity-stars-field__content">
        <h1>The whole sky leans towards your cursor.</h1>
      </div>
    </section>
    <script src="gravity-stars-cursor-field.js"></script>
  </body>
</html>
