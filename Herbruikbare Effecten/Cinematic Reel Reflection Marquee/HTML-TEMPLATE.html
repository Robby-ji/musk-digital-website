<section class="cinematic-reel" data-cinematic-reel aria-label="Watch our reel">
  <div class="cinematic-reel__texture" aria-hidden="true"></div>

  <div class="cinematic-reel__marquee" aria-hidden="true">
    <div class="cinematic-reel__track">
      <p class="cinematic-reel__ticker">Watch our reel&nbsp;&nbsp; · &nbsp;&nbsp;Watch our reel&nbsp;&nbsp; · &nbsp;&nbsp;Watch our reel&nbsp;&nbsp; · &nbsp;&nbsp;Watch our reel&nbsp;&nbsp; · &nbsp;&nbsp;</p>
      <p class="cinematic-reel__ticker">Watch our reel&nbsp;&nbsp; · &nbsp;&nbsp;Watch our reel&nbsp;&nbsp; · &nbsp;&nbsp;Watch our reel&nbsp;&nbsp; · &nbsp;&nbsp;Watch our reel&nbsp;&nbsp; · &nbsp;&nbsp;</p>
    </div>
  </div>

  <div class="cinematic-reel__media" data-reel-toggle role="button" tabindex="0" aria-label="Pause showreel">
    <div class="cinematic-reel__frame">
      <video class="cinematic-reel__video" data-reel-main autoplay muted loop playsinline preload="metadata" poster="pad/naar/poster.png">
        <source src="pad/naar/showreel.mp4" type="video/mp4">
      </video>
    </div>

    <div class="cinematic-reel__reflection" aria-hidden="true">
      <div class="cinematic-reel__reflection-inner">
        <video class="cinematic-reel__video cinematic-reel__video--reflection" data-reel-reflection muted loop playsinline preload="metadata" poster="pad/naar/poster.png" tabindex="-1">
          <source src="pad/naar/showreel.mp4" type="video/mp4">
        </video>
      </div>
    </div>
  </div>
</section>
