<!-- FAQ Reveal Accordion: dupliceer .faq-item voor extra vragen. -->
<section class="faq-reveal" data-faq-section aria-labelledby="faq-title">
  <div class="faq-reveal__shell">
    <header class="faq-reveal__header" data-faq-header>
      <div class="faq-pill"><i aria-hidden="true"></i><span>FAQ</span></div>
      <h2 id="faq-title"><span>Questions?</span><span>We are here to help</span></h2>
    </header>

    <div class="faq-list">
      <article class="faq-item" data-faq-item>
        <button class="faq-question" type="button" aria-expanded="false" aria-controls="faq-answer-1">
          <span class="faq-order">1</span>
          <span class="faq-question__text">Plaats hier de vraag</span>
          <span class="faq-arrow" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="m8.5 10 3.5 3.5 3.5-3.5"></path></svg>
          </span>
        </button>
        <div class="faq-answer-grid" id="faq-answer-1" role="region">
          <div class="faq-answer"><p>Plaats hier het antwoord.</p></div>
        </div>
      </article>
    </div>
  </div>
</section>
