<section class="cinematic-cta" data-cinematic-cta aria-labelledby="cinematic-cta-title">
  <div class="cinematic-cta__card"
       data-cinematic-cta-card
       data-copy-range="34"
       data-video-range="18"
       data-mobile-copy-range="12"
       data-mobile-video-range="16">
    <div class="cinematic-cta__video" aria-hidden="true">
      <video muted loop playsinline preload="metadata"
             poster="assets/cta/cta-poster.jpg"
             data-cinematic-cta-video>
        <source src="assets/cta/cta-video.mp4" type="video/mp4">
      </video>
    </div>
    <div class="cinematic-cta__shade" aria-hidden="true"></div>

    <div class="cinematic-cta__copy">
      <div class="cinematic-cta__eyebrow">
        <i aria-hidden="true"></i><span>Idea &rarr; Reality</span>
      </div>
      <h2 id="cinematic-cta-title">
        <span><span>Got a great idea you</span></span>
        <span><span>want to bring to life?</span></span>
      </h2>
      <a class="cinematic-cta__button" href="#contact-form">Book a call</a>
    </div>

    <nav class="cinematic-cta__socials" aria-label="Social media">
      <a href="https://x.com/" target="_blank" rel="noreferrer" aria-label="Open X">
        <b aria-hidden="true">X</b><span>X (Twitter)</span>
      </a>
      <a href="https://www.linkedin.com/" target="_blank" rel="noreferrer" aria-label="Open LinkedIn">
        <b aria-hidden="true">in</b><span>LinkedIn</span>
      </a>
      <a href="https://www.behance.net/" target="_blank" rel="noreferrer" aria-label="Open Behance">
        <b aria-hidden="true">Bē</b><span>Behance</span>
      </a>
      <a href="https://dribbble.com/" target="_blank" rel="noreferrer" aria-label="Open Dribbble">
        <b aria-hidden="true">◎</b><span>Dribbble</span>
      </a>
    </nav>
  </div>
</section>
