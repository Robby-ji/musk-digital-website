<!-- Orbit Services Scroll: minimaal patroon. Dupliceer een step, nummer en art per dienst. -->
<section class="orbit-services" data-orbit-services>
  <div class="orbit-services__texture" aria-hidden="true"></div>
  <div class="orbit-services__shell">
    <aside class="orbit-services__progress" aria-hidden="true">
      <div class="service-wheel" data-service-wheel>
        <div class="service-wheel__ring"></div>
        <div class="service-wheel__marker"><i></i></div>
        <div class="service-wheel__numbers">
          <div class="service-wheel__number is-active" style="--angle: 0deg" data-service-number="0"><span>01</span></div>
          <!-- Volgende nummers: 30deg, 60deg, 90deg en 120deg. -->
        </div>
      </div>
    </aside>

    <div class="orbit-services__copy">
      <article class="service-step is-active" data-service-step="0">
        <div class="service-step__inner">
          <h2><span>Eerste titelregel</span><span>Tweede titelregel</span></h2>
          <p>Korte omschrijving van de dienst.</p>
          <div class="service-tags"><span>Tag één</span><span>Tag twee</span><span>Tag drie</span></div>
        </div>
      </article>
    </div>

    <aside class="orbit-services__illustrations" aria-hidden="true">
      <div class="service-art is-active" data-service-art="0"><img src="service-01.png" alt=""></div>
    </aside>
  </div>
</section>
